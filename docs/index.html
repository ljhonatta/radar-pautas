<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radar de Pautas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef0f4;--surface:#fff;--raise:#f6f7fa;--ink:#131826;--muted:#5a6378;--line:#d9dde6;
  --accent:#e2600c;--accent-ink:#fff;--tag:#e7eaf2;--tag-ink:#46516e;
  --ok:#1d7a4c;--ok-soft:#ddf1e6;--warn:#8f5c00;--warn-soft:#fbefd2;--bad:#c9372c;
  --f-display:"Montserrat",ui-sans-serif,system-ui,sans-serif;
  --f-body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
:root[data-seg="vpr"]{--accent:#1f4fe0}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14.5px;line-height:1.5}
.wrap{max-width:1380px;margin:0 auto;padding:18px 16px 60px;display:flex;flex-direction:column;gap:16px}
h1,h3{font-family:var(--f-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(22px,3.2vw,30px);font-weight:800}
h3{font-size:15px;font-weight:700;line-height:1.3}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.status{font-size:12.5px;color:var(--muted)}
.segs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){.segs{grid-template-columns:1fr}}
.segbtn{display:flex;gap:14px;align-items:center;text-align:left;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font:inherit;min-width:0}
.segbtn .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;font:800 15px var(--f-display);color:#fff}
.segbtn[data-s="trader"] .ic{background:#e2600c}.segbtn[data-s="vpr"] .ic{background:#1f4fe0}
.segbtn b{display:block;font-family:var(--f-display);font-size:16px}
.segbtn span{font-size:12.5px;color:var(--muted)}
.segbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.btn{font:600 13.5px var(--f-body);padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;display:inline-flex;gap:8px;align-items:center;justify-content:center;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:6px 10px;font-size:12.5px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.coleta{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.coleta .msg{font-size:13.5px;min-width:0;flex:1 1 280px}
.coleta .msg.err{color:var(--bad)}
.turnos{display:flex;gap:6px;flex-wrap:wrap}
.turno{font-family:var(--f-mono);font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.turno.feito{border-color:var(--ok);color:var(--ok)}
.filters{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit;font-size:13.5px;min-width:150px;max-width:100%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--raise)}
.seg button{border:0;background:none;padding:7px 12px;font:600 13px var(--f-body);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:12px}
.pauta{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:9px;min-width:0}
.tags{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tag{font-size:11px;padding:2px 7px;border-radius:5px;background:var(--tag);color:var(--tag-ink);font-weight:600;white-space:nowrap}
.tag.hot{background:var(--accent);color:var(--accent-ink)}.tag.new{background:var(--ok-soft);color:var(--ok)}.tag.up{background:var(--warn-soft);color:var(--warn)}
.meter{display:inline-flex;gap:3px;margin-left:auto}
.meter i{width:14px;height:6px;border-radius:2px;background:var(--tag)}
.meter i.on{background:var(--accent)}
.pauta p{margin:0;font-size:13.5px;color:var(--muted)}
.ang{background:var(--raise);border-radius:9px;padding:9px 11px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.ang b{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.ang em{font-style:normal;color:var(--accent);font-weight:700}
.pauta ul{margin:0;padding-left:18px;font-size:13px}
.nums{display:flex;flex-wrap:wrap;gap:6px}
.num{border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px}
.num b{font-family:var(--f-display);color:var(--accent)}
.meta{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.acts{display:flex;gap:8px;margin-top:auto;padding-top:4px}
.acts .btn{flex:1}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;background:var(--surface)}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="row" style="justify-content:space-between;align-items:flex-end">
    <div><span class="eyebrow">Captação · notícias que viram conteúdo</span><h1>Radar de Pautas</h1></div>
    <span class="status" id="total"></span>
  </div>

  <div class="segs" role="group" aria-label="Segmento">
    <button class="segbtn" data-s="trader" aria-pressed="true"><span class="ic">TS</span><span style="min-width:0"><b>Trader · Mercado financeiro</b><span>Notícias que levam empresários, CLT e liberais para a mentoria</span></span></button>
    <button class="segbtn" data-s="vpr" aria-pressed="false"><span class="ic">VPR</span><span style="min-width:0"><b>VPR · Marketing digital</b><span>Notícias que mostram por que a empresa precisa de agência</span></span></button>
  </div>

  <div class="coleta">
    <div class="msg" id="coletaMsg">Carregando a última coleta…</div>
    <div class="row"><div class="turnos" id="turnos"></div><a class="btn sm" id="btnAtualizar" target="_blank" rel="noopener">Atualizar agora ↗</a></div>
  </div>

  <div class="filters">
    <select id="fCat" aria-label="Filtrar por tema"></select>
    <select id="fPub" aria-label="Filtrar por público"></select>
    <div class="seg" id="fPot" role="group" aria-label="Potencial"><button data-p="all" aria-pressed="true">Todas</button><button data-p="alto" aria-pressed="false">Potencial alto</button></div>
    <select id="fData" aria-label="Filtrar por data"><option value="48h">Últimas 48 horas</option><option value="hoje">Hoje</option><option value="7d" selected>Últimos 7 dias</option><option value="tudo">Tudo (10 dias)</option></select>
    <span class="status" id="pCount"></span>
  </div>

  <div class="pgrid" id="pgrid"></div>
  <footer>Conteúdo educativo. Os posts citam a fonte de cada notícia, não prometem ganhos e não recomendam compra ou venda de ativos. Coleta automática pelo GitHub Actions às 7h, 13h e 19h (Brasília).</footer>
</div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const destaca=s=>esc(s).replace(/\*([^*]+)\*/g,"<em>$1</em>");
let PAUTAS=[],META={},SEG="trader",POT="all";
try{SEG=localStorage.getItem("radar-seg")||"trader"}catch(e){}

function hojeBR(){return new Intl.DateTimeFormat("en-CA",{timeZone:"America/Sao_Paulo"}).format(new Date())}
function fmtHora(iso){try{return new Date(iso).toLocaleString("pt-BR",{timeZone:"America/Sao_Paulo",day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}catch(e){return iso}}

// link do botão "Atualizar agora" para a página do workflow no GitHub
(function(){
  const h=location.hostname, parts=location.pathname.split("/").filter(Boolean);
  let url="https://github.com";
  if(h.endsWith(".github.io")){const user=h.split(".")[0];const repo=parts[0]||h;url=`https://github.com/${user}/${repo}/actions/workflows/coleta.yml`;}
  $("#btnAtualizar").href=url;
  $("#btnAtualizar").title="Abre o GitHub: clique em Run workflow";
})();

async function carregar(){
  try{
    const [p,m]=await Promise.all([fetch("data/pautas.json?t="+Date.now()).then(r=>r.json()),fetch("data/meta.json?t="+Date.now()).then(r=>r.json())]);
    PAUTAS=Array.isArray(p)?p:[];META=m||{};
  }catch(e){$("#coletaMsg").textContent="Não consegui ler os dados ("+e.message+").";$("#coletaMsg").className="msg err";}
  render();
}

function render(){
  document.documentElement.dataset.seg=SEG;
  document.querySelectorAll(".segbtn").forEach(b=>b.setAttribute("aria-pressed",b.dataset.s===SEG));
  const m=META[SEG]||{};
  const msg=$("#coletaMsg");
  msg.className="msg"+(m.status==="erro"?" err":"");
  msg.innerHTML=m.ultimaColeta?`<b>Última coleta ${esc(fmtHora(m.ultimaColeta))}</b> · ${esc(m.mensagem||"")}${m.falhas&&m.falhas.length?` <span class="status">· ${m.falhas.length} fonte(s) com falha</span>`:""}`:"Ainda sem coleta.";
  if(m.falhas&&m.falhas.length)msg.title="Falhas: "+m.falhas.join(", ");
  const hoje=hojeBR();
  const feitas=(m.historico||[]).filter(h=>h.slice(0,10)===hoje).map(h=>+h.slice(11,13));
  $("#turnos").innerHTML=[7,13,19].map(t=>`<span class="turno ${feitas.some(x=>x>=t&&x<t+6)?"feito":""}">${t}h</span>`).join("");

  const doSeg=PAUTAS.filter(p=>p.segmento===SEG);
  fillSel("#fCat","Todos os temas",[...new Set(doSeg.map(p=>p.categoria).filter(Boolean))]);
  fillSel("#fPub","Todos os públicos",[...new Set(doSeg.flatMap(p=>p.publico||[]))]);
  const cat=$("#fCat").value,pub=$("#fPub").value,dt=$("#fData").value;
  const agora=Date.now();
  const lista=doSeg.filter(p=>{
    if(cat&&p.categoria!==cat)return false;
    if(pub&&!(p.publico||[]).includes(pub))return false;
    if(POT==="alto"&&(p.potencial||0)<4)return false;
    const ref=new Date(p.atualizadoEm||p.publicadoEm||p.coletadoEm||p.data).getTime();
    if(dt==="hoje")return (p.data===hoje)||(p.atualizadoEm||"").slice(0,10)===hoje;
    if(dt==="48h")return agora-ref<=48*3600e3;
    if(dt==="7d")return agora-ref<=7*86400e3;
    return true;
  }).sort((a,b)=>(b.atualizadoEm||b.coletadoEm||"").localeCompare(a.atualizadoEm||a.coletadoEm||"")||(b.potencial||0)-(a.potencial||0));
  $("#pCount").textContent=`${lista.length} pauta(s)`;
  $("#total").textContent=`${PAUTAS.length} pautas nos últimos 10 dias`;
  $("#pgrid").innerHTML=lista.length?lista.map(card).join(""):`<div class="empty" style="grid-column:1/-1">Nenhuma pauta com esses filtros.</div>`;
}

function fillSel(sel,todos,vals){
  const el=$(sel),cur=el.value;
  el.innerHTML=`<option value="">${todos}</option>`+vals.sort().map(v=>`<option${v===cur?" selected":""}>${esc(v)}</option>`).join("");
}

function card(p){
  const pot=p.potencial||0;
  const st=p.status==="atualizada"?'<span class="tag up">Atualizada</span>':(p.data===hojeBR()?'<span class="tag new">Nova</span>':"");
  return `<article class="pauta">
    <div class="tags">${pot>=5?'<span class="tag hot">Potencial 5</span>':""}${st}<span class="tag">${esc(p.categoria)}</span>${(p.publico||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join("")}
      <span class="meter" title="Potencial ${pot} de 5">${[1,2,3,4,5].map(i=>`<i class="${i<=pot?"on":""}"></i>`).join("")}</span></div>
    <h3>${esc(p.titulo)}</h3>
    <p>${esc(p.resumo)}</p>
    ${(p.numeros||[]).length?`<div class="nums">${p.numeros.map(n=>`<span class="num"><b>${esc(n.valor)}</b> ${esc(n.rotulo)}</span>`).join("")}</div>`:""}
    <ul>${(p.fatos||[]).map(f=>`<li>${esc(f)}</li>`).join("")}</ul>
    <div class="ang"><b>Dor</b>${esc(p.dor)}</div>
    <div class="ang"><b>Ângulo</b>${esc(p.angulo)}</div>
    <div class="ang"><b>Gancho de capa</b><span style="font-weight:600">${destaca(p.gancho)}</span></div>
    <div class="ang"><b>Ideias de post</b>${(p.ideias||[]).map(i=>"· "+esc(i)).join("<br>")}<span class="status">${esc((p.formatos||[]).join(" · "))}</span></div>
    <div class="meta"><span>${esc(p.fonte)}</span><span>${esc(fmtHora(p.publicadoEm||p.data))}${p.horaEstimada?" (aprox.)":""}</span>${p.atualizadoEm?`<span>atualizada ${esc(fmtHora(p.atualizadoEm))}</span>`:""}</div>
    <div class="acts"><a class="btn sm" href="${esc(p.url)}" target="_blank" rel="noopener">${p.urlBusca?"Buscar notícia ↗":"Ver notícia ↗"}</a><button class="btn sm primary" data-copy="${esc(p.id)}">Copiar pauta</button></div>
  </article>`;
}

document.addEventListener("click",async e=>{
  const s=e.target.closest(".segbtn");
  if(s){SEG=s.dataset.s;try{localStorage.setItem("radar-seg",SEG)}catch(_){}$("#fCat").value="";$("#fPub").value="";render();return}
  const pb=e.target.closest("#fPot button");
  if(pb){POT=pb.dataset.p;document.querySelectorAll("#fPot button").forEach(b=>b.setAttribute("aria-pressed",b===pb));render();return}
  const cp=e.target.closest("[data-copy]");
  if(cp){
    const p=PAUTAS.find(x=>x.id===cp.dataset.copy);if(!p)return;
    const txt=`${p.titulo}\n\n${p.resumo}\n\nFatos:\n${(p.fatos||[]).map(f=>"- "+f).join("\n")}\n\nDor: ${p.dor}\nÂngulo: ${p.angulo}\nGancho: ${p.gancho}\nIdeias: ${(p.ideias||[]).join(" | ")}\nFonte: ${p.fonte} · ${p.url}`;
    try{await navigator.clipboard.writeText(txt);cp.textContent="Copiado ✓"}catch(_){cp.textContent="Não deu para copiar"}
    setTimeout(()=>cp.textContent="Copiar pauta",1800);
  }
});
["#fCat","#fPub","#fData"].forEach(s=>$(s).addEventListener("change",render));
carregar();
setInterval(carregar,10*60e3);
</script>
</body>
</html>
